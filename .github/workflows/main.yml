name: Osu Data Auto-Sync
on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout atlas-all
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Data Archiver
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: python -u parser.py

      - name: Save progress to atlas-all
        run: |
          git config --global user.name "kiroffYT"
          git config --global user.email "kirhit135@gmail.com"
          git add processed_sets.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update progress [skip ci]"
          git push
