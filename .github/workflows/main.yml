name: Osu Data Auto-Sync

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: 'Runs count'
        required: true
        default: '3'

concurrency:
  group: osu-archiver
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout atlas-all
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Data Archiver
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: python -u parser.py

      - name: Save progress to atlas-all
        run: |
          git config --global user.name "kiroffYT"
          git config --global user.email "kirhit135@gmail.com"
          git add processed_sets.txt
          if ! git diff --quiet --staged; then
            git commit -m "Update progress [skip ci]"
            git pull --rebase -X ours origin main
            git push origin main
          fi

      - name: Trigger next run if needed
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: "main.yml" 
          CURRENT_COUNT: ${{ github.event.inputs.run_count }}
        run: |
          NEXT_COUNT=$((CURRENT_COUNT - 1))
          echo "Run count: $CURRENT_COUNT / $NEXT_COUNT"
          
          if [ "$NEXT_COUNT" -gt 0 ]; then
            echo "[*] Another cycle starts..."
            curl -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_ID/dispatches \
              -d "{\"ref\":\"main\", \"inputs\": {\"run_count\": \"$NEXT_COUNT\"}}"
          else
            echo "[*] Run count is ended. And parsing (for this session) too."
          fi
